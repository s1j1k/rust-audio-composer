[package]
name = "rust-audio-composer"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.15.3"
eframe = "0.30.0"
egui = "0.30.0"
egui_plot = "0.30.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
hound = "3.5"
claxon = "0.4.3"
ureq = { version = "=2.9.7", default-features = false, features = ["tls", "native-tls"] }
